<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ac:#14a35f;--acs:color-mix(in srgb,var(--ac) 12%,var(--sf));--bg:#f4f6f8;--sf:#fff;--ink:#12151c;--i2:#4a5160;--i3:#8189997a;--i3:#7b8394;--ln:#e6e9ee;--ok:#16a34a;--okb:#dcf5e5;--wn:#b45309;--wnb:#fdf0d0;--bd:#dc2626;--bdb:#fde4e4;--inf:#2f5bea;--infb:#e4ebfd;--mu:#eef0f4;--r:12px}
[data-t=dark]{--bg:#0f1318;--sf:#171c23;--ink:#eef1f5;--i2:#b4bcc9;--i3:#808a9a;--ln:#262d37;--okb:#12301f;--wnb:#33280f;--bdb:#3a1a1a;--infb:#18264a;--mu:#212832}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hidden{display:none!important}.g{color:var(--ok)}.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.mark{width:36px;height:36px;border-radius:10px;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:800;overflow:hidden;flex-shrink:0}.mark img{width:100%;height:100%;object-fit:contain}.mark:has(img){background:transparent}
.vd{display:flex;gap:10px;align-items:center;font-size:11.5px;color:var(--i3);line-height:1.3;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--ln)}.vd img{width:32px;height:32px;border-radius:8px;object-fit:contain}.vd b{color:var(--ink);font-size:12.5px}.vd a{color:inherit;text-decoration:none}
#login .vd{border:0;justify-content:center;margin:0}.lgp img{object-fit:contain!important}
#login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,var(--acs),transparent 55%),var(--bg)}
.lc{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:36px;width:100%;max-width:400px;box-shadow:0 24px 60px -30px rgba(0,0,0,.35)}
.lb{display:flex;gap:12px;align-items:center;margin-bottom:24px}.lb b{display:block;font-size:18px;font-weight:800;line-height:1.2}.lb span{font-size:12.5px;color:var(--i3)}
.lc h1{font-size:20px}.lc>p{color:var(--i3);margin:2px 0 20px}
.err{background:var(--bdb);color:var(--bd);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px}
#app{display:none;min-height:100vh;grid-template-columns:250px 1fr}#app.show{display:grid}
aside{background:var(--sf);border-right:1px solid var(--ln);padding:18px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sb{display:flex;gap:11px;align-items:center;padding:4px 8px 20px}.sb b{font-weight:800;font-size:16px;display:block;line-height:1.2}.sb span{font-size:11.5px;color:var(--i3)}
nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto}
nav small{font-size:11px;font-weight:700;color:var(--i3);padding:14px 12px 4px;letter-spacing:.4px}
nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--i2);text-decoration:none}
nav a:hover{background:var(--bg);color:var(--ink)}nav a.on{background:var(--acs);color:var(--ac)}
.sf{margin-top:auto;border-top:1px solid var(--ln);padding:14px 8px 0;font-size:12.5px;color:var(--i3)}.sf b{display:block;color:var(--ink);word-break:break-all;margin-bottom:6px}.sf button:hover{color:var(--bd)}
.top{display:flex;align-items:center;gap:12px;padding:14px 40px;background:var(--sf);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:30}
.top .sr{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;color:var(--i3)}
.top .sr input{background:none;border:0;outline:0;flex:1;min-width:0}
.ib{width:38px;height:38px;border:1px solid var(--ln);border-radius:10px;display:grid;place-items:center;color:var(--i2)}.ib:hover{color:var(--ac)}
.burger{display:none}.sp{flex:1}
.av{width:36px;height:36px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:800}
main{padding:28px 40px 60px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:20px 24px;margin-bottom:18px}
.head h2{font-size:24px;font-weight:800;letter-spacing:-.3px}.head p{color:var(--i3)}.acts{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;font-weight:700;font-size:13px;border-radius:10px;background:var(--ac);color:#fff;border:1px solid transparent;white-space:nowrap}
.btn:hover{filter:brightness(.93)}.btn.gh{background:var(--sf);color:var(--ink);border-color:var(--ln)}.btn.dg{background:var(--bdb);color:var(--bd)}.btn.sm{padding:6px 11px;font-size:12px}.btn:disabled{opacity:.5}
.ban{background:linear-gradient(120deg,#0f8f52,#19b36b);color:#fff;border-radius:var(--r);padding:24px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:18px}
.ban h2{font-size:21px;font-weight:800}.ban p{opacity:.9;margin-top:4px}
.ban .mi{display:flex;gap:10px;flex-wrap:wrap}.ban .mi div{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:10px 18px;text-align:center;min-width:92px}.ban .mi b{display:block;font-size:22px;font-weight:800}.ban .mi span{font-size:11.5px;opacity:.9}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.st{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:18px;display:flex;gap:14px;align-items:center}
.st .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.st .ic.ok{background:var(--okb);color:var(--ok)}.st .ic.inf{background:var(--infb);color:var(--inf)}.st .ic.bd{background:var(--bdb);color:var(--bd)}.st .ic.wn{background:var(--wnb);color:var(--wn)}
.st small{display:block;font-size:12px;font-weight:700;color:var(--i3)}.st b{font-size:24px;font-weight:800;letter-spacing:-.4px;line-height:1.2}
.g2{display:grid;grid-template-columns:1.7fr 1fr;gap:14px;margin-bottom:18px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:20px;min-width:0}
.card h3{font-size:15px;font-weight:800;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}.card h3 small{font-weight:600;color:var(--i3);font-size:12px}
.donut{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.dn{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}.dn div{width:96px;height:96px;border-radius:50%;background:var(--sf);display:grid;place-items:center;text-align:center;font-size:11.5px;color:var(--i3);line-height:1.2}.dn b{display:block;font-size:22px;color:var(--ink)}
.lg{list-style:none;flex:1;min-width:130px;display:flex;flex-direction:column;gap:8px;font-size:13px}.lg li{display:flex;align-items:center;gap:8px}.lg i{width:9px;height:9px;border-radius:50%}.lg em{margin-left:auto;font-style:normal;font-weight:700}
.act{list-style:none}.act li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln);font-size:13px}.act li:last-child{border:0}.act .dt{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}.act small{display:block;color:var(--i3);font-size:12px}
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.bar input,.bar select{padding:10px 14px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);flex:1 1 220px;max-width:380px}
.tw{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:680px}
th,td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--ln);font-size:13.5px;vertical-align:middle}
th{font-size:11.5px;font-weight:800;color:var(--i3);background:var(--bg);white-space:nowrap}tr:last-child td{border-bottom:0}tbody tr.c{cursor:pointer}tbody tr:hover td{background:var(--bg)}
td b{font-weight:700}td small{display:block;color:var(--i3);font-size:12px}
.th{width:40px;height:40px;border-radius:10px;background:var(--mu);display:grid;place-items:center;overflow:hidden;color:var(--i3);flex-shrink:0}.th img{width:100%;height:100%;object-fit:cover}.cp{display:flex;gap:12px;align-items:center}
.ra{display:flex;gap:8px;justify-content:flex-end}
.tag{display:inline-block;padding:3px 11px;font-size:12px;border-radius:20px;font-weight:700;white-space:nowrap}
.tag.ok{background:var(--okb);color:var(--ok)}.tag.warn{background:var(--wnb);color:var(--wn)}.tag.bad{background:var(--bdb);color:var(--bd)}.tag.off{background:var(--mu);color:var(--i3)}
.emp{padding:46px 20px;text-align:center;color:var(--i3)}
.mb{position:fixed;inset:0;background:rgba(10,12,16,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.md{background:var(--sf);width:100%;max-width:620px;max-height:92vh;overflow-y:auto;border-radius:16px;padding:26px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5)}
.md h3{font-size:19px;font-weight:800;margin-bottom:16px}
.fd{margin-bottom:13px}.fd label{display:block;font-size:12.5px;font-weight:700;color:var(--i2);margin-bottom:5px}
.fd input:not([type=checkbox]),.fd select,.fd textarea,.ln input,.ln select{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:9px;background:var(--sf)}
.fd input:focus,.fd select:focus,.fd textarea:focus{border-color:var(--ac);outline:0;box-shadow:0 0 0 3px var(--acs)}
.fd.ck label{display:flex;gap:8px;align-items:center;cursor:pointer}.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ma{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.ln{display:grid;grid-template-columns:2.4fr .8fr 1fr 34px;gap:8px;margin-bottom:8px}
.tot{display:flex;justify-content:space-between;font-size:16px;padding:12px 0;margin:6px 0 10px;border-top:1px solid var(--ln)}
.it{border:1px solid var(--ln);border-radius:10px;margin:12px 0;overflow:hidden}.it div{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--ln)}.it div:last-child{border:0;background:var(--bg);font-weight:800}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}.dl small{color:var(--i3);display:block;font-size:12px;font-weight:600}.dl b{font-weight:700}
.chs{width:100%;height:auto;display:block}
.ts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--ink);color:var(--sf);padding:12px 20px;border-radius:10px;font-weight:700;z-index:100;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}.ts.show{opacity:1;transform:translateX(-50%)}.ts.bad{background:var(--bd);color:#fff}
#cn{padding:12px 16px;border-radius:10px;margin-bottom:18px;font-weight:600;font-size:13px;background:var(--wnb);color:var(--wn)}
.scr{display:none;position:fixed;inset:0;background:rgba(10,12,16,.5);z-index:39}.scr.show{display:block}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
@media(max-width:820px){#app.show{display:block}aside{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:40;transform:translateX(-100%);transition:transform .22s}aside.open{transform:none}.burger{display:grid}.top{padding:12px 16px}main{padding:20px 16px 50px}.fr,.dl{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.ln{grid-template-columns:1fr 1fr}.ln select{grid-column:1/-1}}
.pb{height:6px;background:var(--mu);border-radius:6px;margin-top:6px;overflow:hidden}.pb i{display:block;height:100%;border-radius:6px}.rw{padding:9px 0}.rw>div:first-child{display:flex;justify-content:space-between;font-size:13px;font-weight:600}.rw b{font-weight:800}
.ov2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ov2>div{background:var(--bg);border-radius:12px;padding:18px 10px;text-align:center}.ov2 b{display:block;font-size:22px;font-weight:800;line-height:1.2}.ov2 span{font-size:12px;color:var(--i3);font-weight:600}
.bar select{flex:0 1 230px}
@media print{aside,.top,.acts{display:none}}
</style>
</head>
<body>
<div id="login"><div class="lc">
  <div class="lb"><div class="mark" data-mk></div><div><b data-bn></b><span data-bt></span></div></div>
  <h1>Connexion</h1><p>Connectez-vous pour accéder à votre espace.</p>
  <div id="le" class="err hidden"></div>
  <form id="lf"><div class="fd"><label>Email</label><input id="em" type="email" autocomplete="username" required></div>
  <div class="fd"><label>Mot de passe</label><input id="pw" type="password" autocomplete="current-password" required></div>
  <button class="btn" id="lb" style="width:100%;padding:12px">Se connecter</button></form><div data-vd style="margin-top:24px"></div>
</div></div>

<div id="app">
  <div class="scr" id="scr"></div>
  <aside id="sd"><div class="sb"><div class="mark" data-mk></div><div><b data-bn></b><span data-bt></span></div></div>
    <nav id="nv"></nav>
    <div class="sf"><div data-vd></div><b id="who"></b><button id="lo">Se déconnecter</button></div>
  </aside>
  <div style="min-width:0">
    <div class="top">
      <button class="ib burger" id="bg" aria-label="Menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="sr"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="gs" placeholder="Rechercher un produit, un client, une facture…"></div>
      <span class="sp"></span>
      <button class="ib" id="dk" aria-label="Thème"><svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      <div class="av" id="av"></div>
    </div>
    <main><div id="cn" class="hidden"></div><div id="view"></div></main>
  </div>
</div>
<div id="mroot"></div><div class="ts" id="ts" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================= CONFIG — seul bloc à modifier pour chaque client ================= */
const C={
  brand:{name:"ADIL HAWI ADAM",tag:"Gestion de stock",logo:"",accent:"#14a35f"},
  vendor:{name:"",tag:"Logiciel développé par",logo:"",url:""},
  supabase:{url:"https://mmdmzgrzvzfwypxekpgu.supabase.co",anonKey:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1tZG16Z3J6dnpmd3lweGVrcGd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExODY0NDMsImV4cCI6MjEwNjc2MjQ0M30.J62nV0r61Bjijss8IWw3FlNOoe52XQGuCn2WyOA5yoQ",bucket:"products"},
  currency:"DH",locale:"fr-FR"
};
/* ===================================================================================== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString(C.locale,{maximumFractionDigits:2})+" "+C.currency;
const fd=d=>d?new Date(d).toLocaleDateString(C.locale):"—";
const tag=(t,k)=>`<span class="tag ${k}">${esc(t)}</span>`;
const sum=(a,f)=>a.reduce((s,x)=>s+Number(f(x)||0),0);
const nm=(t,id)=>(D[t].find(x=>x.id===id)||{}).name||"—";
const stk=p=>p.qty<=0?tag('Rupture','bad'):p.qty<=p.min_stock?tag('Stock faible','warn'):tag('En stock','ok');
const pay=s=>Number(s.paid)>=Number(s.total)?tag('Payée','ok'):Number(s.paid)>0?tag('Partielle','warn'):tag('Impayée','bad');
const IC={grid:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',tag:'<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.2"/>',cart:'<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.5L21 8H6"/>',bag:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 21a7 7 0 0 1 14 0M17 4.5a3.5 3.5 0 0 1 0 7M22 21a7 7 0 0 0-4-6.3"/>',truck:'<path d="M1 4h13v12H1zM14 8h4l4 4v4h-8"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',wallet:'<path d="M20 7H5a2 2 0 0 1 0-4h13v4zM3 5v14a2 2 0 0 0 2 2h15V7"/><circle cx="16" cy="14" r="1.2"/>',chart:'<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/>',cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',dollar:'<path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',ok:'<path d="m5 12 5 5 9-10"/>',warn:'<path d="M12 3 2 21h20zM12 10v5M12 18h.01"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',trend:'<path d="m3 17 6-6 4 4 8-8M15 7h6v6"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]||''}</svg>`;
let toastT;const toast=(m,bad)=>{const t=$('#ts');t.textContent=m;t.className='ts show'+(bad?' bad':'');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2800)};
const modal=h=>{$('#mroot').innerHTML=`<div class="mb"><div class="md">${h}</div></div>`};
const closeM=()=>{$('#mroot').innerHTML=''};
document.addEventListener('click',e=>{if(e.target.closest('[data-x]')||e.target.classList.contains('mb'))closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});

/* ---------- brand + supabase ---------- */
let B={...C.brand},V={...C.vendor};const cfg=!!(C.supabase.url&&C.supabase.anonKey);
function brand(){const b=S||{},n=b.store_name||C.brand.name;
  B={name:n,tag:b.tagline??C.brand.tag,logo:b.logo||C.brand.logo,accent:/^#[0-9a-f]{6}$/i.test(b.accent||'')?b.accent:C.brand.accent};
  if(b.currency)C.currency=b.currency;
  V={name:b.vendor_name||C.vendor.name,tag:b.vendor_tag||C.vendor.tag,logo:b.vendor_logo||C.vendor.logo,url:b.vendor_url||C.vendor.url};
  document.documentElement.style.setProperty('--ac',B.accent);document.title=n+' — Admin';
  $$('[data-bn]').forEach(e=>e.textContent=n);$$('[data-bt]').forEach(e=>e.textContent=B.tag||'');
  $$('[data-mk]').forEach(e=>e.innerHTML=B.logo?`<img src="${esc(B.logo)}" alt="">`:esc((n.trim()[0]||'?').toUpperCase()));
  if(B.logo){let l=$('link[rel=icon]');if(!l){l=document.createElement('link');l.rel='icon';document.head.appendChild(l)}l.href=B.logo}
  const vh=(V.name||V.logo)?`<div class="vd">${V.logo?`<img src="${esc(V.logo)}" alt="">`:''}<span>${esc(V.tag)}<br><b>${V.url?`<a href="${esc(V.url)}" target="_blank" rel="noopener">${esc(V.name)}</a>`:esc(V.name)}</b></span></div>`:'';
  $$('[data-vd]').forEach(e=>e.innerHTML=vh)}

async function load(){

  await Promise.all(Object.keys(Q).map(async k=>{const {data,error}=await sb.from(k).select(Q[k]).order('id',{ascending:false});if(error)fail=fail||error;else D[k]=data||[]}));
  const {data:st}=await sb.from('settings').select('*').eq('id',1).maybeSingle();S=st||{};try{localStorage.setItem('bs',JSON.stringify(S))}catch(e){}brand();

  go()}

/* ---------- generic list page ---------- */
function statHtml(a){return `<div class="stats" style="grid-template-columns:repeat(${a.length},1fr)">${a.map(s=>`<div class="st"><div class="ic ${s[2]}">${ic(s[3])}</div><div><small>${esc(s[0])}</small><b class="num">${esc(s[1])}</b></div></div>`).join('')}</div>`}
function listPage(k){const m=M[k];
  $('#view').innerHTML=`<div class="head"><div><h2>${m.t}</h2><p>${m.sub}</p></div><div class="acts"><button class="btn dg hidden" id="bk"></button>${m.imp?'<button class="btn gh" id="im">Importer CSV</button><input type="file" id="imf" accept=".csv" hidden>':''}<button class="btn gh" id="ex">Exporter CSV</button><button class="btn" id="ad">+ ${m.add}</button></div></div>${m.stats?statHtml(m.stats()):''}<div class="bar"><input id="q" type="search" placeholder="Rechercher…">${(m.filt||[]).map((f,i)=>`<select data-f="${i}"><option value="">${f[1]}</option>${f[2]().map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}</select>`).join('')}</div><div class="tw"><table><thead><tr><th style="width:36px"><input type="checkbox" id="ca" aria-label="Tout sélectionner"></th>${m.cols.map(c=>`<th>${c[0]}</th>`).join('')}<th></th></tr></thead><tbody id="tb"></tbody></table></div>`;
  const fill=()=>{const q=$('#q').value.trim().toLowerCase(),L=D[k].filter(r=>(!q||JSON.stringify(r).toLowerCase().includes(q))&&(m.filt||[]).every((f,i)=>{const v=($$('.bar [data-f]')[i]||{}).value;return !v||f[3](r,v)}));
    $('#tb').innerHTML=L.length?L.map(r=>`<tr class="${m.doc?'c':''}" data-id="${r.id}"><td><input type="checkbox" class="ck" aria-label="Sélection"></td>${m.cols.map(c=>`<td>${c[1](r)}</td>`).join('')}<td><div class="ra">${m.doc?`<button class="btn gh sm" data-v>Voir</button>`:`<button class="btn gh sm" data-e>Modifier</button>`}<button class="btn dg sm" data-d>Supprimer</button></div></td></tr>`).join(''):`<tr><td colspan="${m.cols.length+2}"><div class="emp"><b>Aucun résultat</b><br>Ajoutez un premier élément avec le bouton en haut à droite.</div></td></tr>`};
  fill();$('#q').oninput=fill;$$('.bar select').forEach(s=>s.onchange=fill);$('#ad').onclick=()=>m.doc?doc(k):form(k);$('#ex').onclick=()=>csv(k);
  const sel=()=>$$('.ck:checked').map(c=>+c.closest('tr').dataset.id),upd=()=>{const n=sel().length,b=$('#bk');b.classList.toggle('hidden',!n);b.textContent='Supprimer ('+n+')'};
  $('#ca').onchange=e=>{$$('.ck').forEach(c=>c.checked=e.target.checked);upd()};$('#tb').addEventListener('change',e=>{if(e.target.classList.contains('ck'))upd()});
  $('#bk').onclick=async()=>{const ids=sel();if(!ids.length||!confirm('Supprimer '+ids.length+' élément(s) ?'))return;const {error}=await sb.from(k).delete().in('id',ids);if(error)return toast(error.message,1);toast('Supprimé');load()};
  if(m.imp){$('#im').onclick=()=>$('#imf').click();$('#imf').onchange=e=>imp(e.target.files[0])}
  $('#tb').onclick=e=>{const tr=e.target.closest('tr[data-id]');if(!tr||e.target.classList.contains('ck'))return;const id=+tr.dataset.id;
    if(e.target.closest('[data-d]'))return del(k,id);if(e.target.closest('[data-e]'))return form(k,id);if(m.doc)view(k,id)}}
const pbar=(l,v,t,c,x)=>`<div class="rw"><div><span>${l}</span><b>${x??v}</b></div><div class="pb"><i style="width:${Math.min(100,t?v/t*100:0)}%;background:${c}"></i></div></div>`;
const av=n=>`<div class="cp"><div class="th" style="background:var(--ac);color:#fff;border-radius:50%;font-weight:800">${esc((n||'?')[0].toUpperCase())}</div><b>${esc(n)}</b></div>`;
async function imp(f){if(!f)return;const t=(await f.text()).replace(/^\ufeff/,'').split(/\r?\n/).filter(x=>x.trim());if(t.length<2)return toast('Fichier vide',1);const sep=t[0].includes(';')?';':',';
  const sp=l=>l.split(sep).map(x=>x.trim().replace(/^"|"$/g,'')),h=sp(t[0]).map(x=>x.toLowerCase());
  const rows=t.slice(1).map(l=>{const c=sp(l),o={};h.forEach((x,i)=>o[x]=c[i]);const cat=D.categories.find(x=>x.name.toLowerCase()===(o.category||o.categorie||'').toLowerCase());
    return {name:o.name||o.nom,sku:o.sku||null,brand:o.brand||o.marque||null,category_id:cat?cat.id:null,purchase_price:+(o.purchase_price||0),selling_price:+(o.selling_price||0),qty:parseInt(o.qty||0)||0}}).filter(r=>r.name);
  if(!rows.length)return toast('Colonnes attendues : name, sku, brand, category, purchase_price, selling_price, qty',1);
  const {error}=await sb.from('products').insert(rows);if(error)return toast(error.message,1);toast(rows.length+' produits importés');load()}
async function del(k,id){if(!confirm('Supprimer définitivement cet élément ?'))return;
  const {error}=await sb.from(k).delete().eq('id',id);if(error)return toast(error.message,1);toast('Supprimé');load()}
function csv(k){const L=D[k];if(!L.length)return toast('Rien à exporter',1);const ks=Object.keys(L[0]).filter(x=>typeof L[0][x]!=='object'||L[0][x]===null);
  const t=[ks].concat(L.map(r=>ks.map(x=>r[x]))).map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv;charset=utf-8'}));a.download=k+'-'+td()+'.csv';a.click()}

/* ---------- generic form ---------- */
function fieldHtml(f,r){const [n,l,t,rq]=f,v=r[n]??'';let h;
  if(t==='chk')return `<div class="fd ck"><label><input type="checkbox" id="f_${n}" ${r[n]?'checked':''}> ${l}</label></div>`;
  if(t.startsWith('sel'))h=`<select id="f_${n}"><option value="">—</option>${D[t.slice(4)].map(o=>`<option value="${o.id}" ${o.id===v?'selected':''}>${esc(o.name)}</option>`).join('')}</select>`;
  else if(t==='area')h=`<textarea id="f_${n}" rows="3">${esc(v)}</textarea>`;
  else if(t==='img')h=`<div style="display:flex;gap:8px"><input id="f_${n}" value="${esc(v)}" placeholder="https://…"><label class="btn gh sm" style="cursor:pointer">Importer<input type="file" id="up" accept="image/*" hidden></label></div>`;
  else h=`<input id="f_${n}" type="${t==='date'?'date':t==='text'?'text':'number'}" ${t==='num'?'step="0.01" min="0"':t==='int'?'step="1" min="0"':''} value="${esc(t==='date'&&!v?td():v)}" ${rq?'required':''}>`;
  return `<div class="fd"><label>${l}${rq?' *':''}</label>${h}</div>`}
function form(k,id){const m=M[k],r=id?D[k].find(x=>x.id===id):{...m.def};
  modal(`<h3>${id?'Modifier':'Ajouter'} — ${m.t.toLowerCase()}</h3><form id="f"><div class="fr">${m.fields.map(f=>fieldHtml(f,r)).join('')}</div><div class="ma"><button type="button" class="btn gh" data-x>Annuler</button><button class="btn">Enregistrer</button></div></form>`);
  const up=$('#up');if(up)up.onchange=async()=>{const f=up.files[0];if(!f)return;if(f.size>5e6)return toast('Image trop lourde (5 Mo max)',1);
    const p=Date.now()+'-'+f.name.replace(/[^\w.-]/g,'_');toast('Import…');const {error}=await sb.storage.from(C.supabase.bucket).upload(p,f);
    if(error)return toast(error.message,1);$('#f_image').value=sb.storage.from(C.supabase.bucket).getPublicUrl(p).data.publicUrl;toast('Image importée')};
  $('#f').onsubmit=async e=>{e.preventDefault();const v={};
    m.fields.forEach(([n,l,t])=>{const el=$('#f_'+n);v[n]=t==='chk'?el.checked:el.value===''?null:(t==='num'||t==='int'||t.startsWith('sel'))?Number(el.value):el.value.trim()});
    const {error}=id?await sb.from(k).update(v).eq('id',id):await sb.from(k).insert(v);
    if(error)return toast(error.code==='23505'?'Ce SKU existe déjà':error.message,1);closeM();toast('Enregistré');load()}}

let L=[];const pr=id=>D.products.find(p=>p.id===id);
function doc(k){const s=k==='sales';L=[{q:1}];
  modal(`<h3>${s?'Nouvelle vente (POS)':'Nouvel achat'}</h3><div class="fr"><div class="fd"><label>${s?'Client':'Fournisseur'}</label><select id="dp"><option value="">${s?'Client comptoir':'—'}</option>${D[s?'customers':'suppliers'].map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('')}</select></div><div class="fd"><label>Date</label><input type="date" id="dd" value="${td()}"></div></div>
  ${s?`<div class="fd"><label>Mode de paiement</label><select id="dm"><option>Espèces</option><option>Carte</option><option>Virement</option><option>Chèque</option></select></div>`:''}
  <label style="font-size:12.5px;font-weight:700;color:var(--i2)">Articles</label><div id="ls" style="margin-top:6px"></div><button type="button" class="btn gh sm" id="al">+ Ajouter une ligne</button>
  <div class="tot"><span>Total</span><b id="tt"></b></div>${s?`<div class="fd"><label>Montant payé (vide = payé en totalité)</label><input type="number" id="dpd" step="0.01" min="0"></div>`:''}
  <div class="ma"><button type="button" class="btn gh" data-x>Annuler</button><button class="btn" id="sv">Enregistrer</button></div>`);
  const tot=()=>$('#tt').textContent=money(sum(L,l=>(l.p?l.q*l.u:0)));
  const draw=()=>{$('#ls').innerHTML=L.map((l,i)=>`<div class="ln" data-i="${i}"><select data-f="p"><option value="">Produit…</option>${D.products.filter(p=>p.active).map(p=>`<option value="${p.id}" ${p.id===l.p?'selected':''}>${esc(p.name)}${s?` (${p.qty})`:''}</option>`).join('')}</select><input type="number" data-f="q" min="1" value="${l.q||1}" aria-label="Quantité"><input type="number" data-f="u" step="0.01" min="0" value="${l.u??''}" aria-label="Prix"><button type="button" class="btn dg sm" data-r>×</button></div>`).join('');tot()};
  draw();$('#al').onclick=()=>{L.push({q:1});draw()};
  $('#ls').addEventListener('input',e=>{const r=e.target.closest('.ln'),f=e.target.dataset.f;if(!r||!f)return;const l=L[+r.dataset.i];l[f]=Number(e.target.value);tot()});
  $('#ls').addEventListener('change',e=>{if(e.target.dataset.f!=='p')return;const l=L[+e.target.closest('.ln').dataset.i],p=pr(Number(e.target.value));l.p=p?p.id:null;l.u=p?(s?p.selling_price:p.purchase_price):'';draw()});
  $('#ls').addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b)return;L.splice(+b.closest('.ln').dataset.i,1);if(!L.length)L.push({q:1});draw()});
  $('#sv').onclick=async()=>{const ls=L.filter(l=>l.p&&l.q>0);if(!ls.length)return toast('Ajoutez au moins un article',1);
    if(s)for(const l of ls){const p=pr(l.p),need=sum(ls.filter(x=>x.p===l.p),x=>x.q);if(p.qty<need)return toast(`Stock insuffisant : ${p.name} (${p.qty} dispo)`,1)}
    const total=sum(ls,l=>l.q*l.u),b=$('#sv');b.disabled=true;
    const h=s?{customer_id:+$('#dp').value||null,date:$('#dd').value,method:$('#dm').value,total,paid:$('#dpd').value===''?total:Number($('#dpd').value)}:{supplier_id:+$('#dp').value||null,date:$('#dd').value,total};
    const {data,error}=await sb.from(k).insert(h).select().single();if(error){b.disabled=false;return toast(error.message,1)}
    const items=ls.map(l=>{const p=pr(l.p);return s?{sale_id:data.id,product_id:p.id,name:p.name,quantity:l.q,price:l.u,cost:p.purchase_price}:{purchase_id:data.id,product_id:p.id,name:p.name,quantity:l.q,cost:l.u}});
    const e2=(await sb.from(s?'sale_items':'purchase_items').insert(items)).error;
    if(e2){await sb.from(k).delete().eq('id',data.id);b.disabled=false;return toast(e2.message,1)}
    closeM();toast(s?'Vente enregistrée':'Achat enregistré');load()}}
function view(k,id){const s=k==='sales',r=D[k].find(x=>x.id===id),its=(s?r.sale_items:r.purchase_items)||[];
  modal(`<h3>${s?'Facture '+esc(r.invoice_no):'Achat '+esc(r.ref)}</h3><div class="dl"><div><small>${s?'Client':'Fournisseur'}</small><b>${esc(s?(r.customer_id?nm('customers',r.customer_id):'Client comptoir'):nm('suppliers',r.supplier_id))}</b></div><div><small>Date</small><b>${fd(r.date)}</b></div>${s?`<div><small>Paiement</small><b>${esc(r.method)}</b></div><div><small>Statut</small>${pay(r)}</div>`:''}</div>
  <div class="it">${its.map(i=>`<div><span>${esc(i.name)} × ${i.quantity}</span><span class="num">${money(i.quantity*(s?i.price:i.cost))}</span></div>`).join('')}<div><span>Total</span><span class="num">${money(r.total)}</span></div></div>
  ${s&&r.paid<r.total?`<p style="margin-bottom:6px">Reste à encaisser : <b>${money(r.total-r.paid)}</b></p>`:''}
  <div class="ma"><button class="btn gh" data-x>Fermer</button>${s&&r.paid<r.total?'<button class="btn gh" id="mp">Marquer payée</button>':''}${s?'<button class="btn" id="pt">Imprimer la facture</button>':''}</div>`);
  const mp=$('#mp');if(mp)mp.onclick=async()=>{const {error}=await sb.from('sales').update({paid:r.total}).eq('id',id);if(error)return toast(error.message,1);closeM();toast('Facture payée');load()};
  const pt=$('#pt');if(pt)pt.onclick=()=>{const w=open('','_blank');if(!w)return toast('Autorisez les pop-ups',1);
    w.document.write(`<html><head><title>${esc(r.invoice_no)}</title></head><body style="font-family:Arial,sans-serif;padding:40px;max-width:760px;margin:auto">${B.logo?`<img src="${esc(B.logo)}" style="height:56px"><br>`:''}<h2>${esc(S.store_name||B.name)}</h2><p style="color:#555">${esc(S.address||'')}<br>${esc(S.phone||'')} ${esc(S.email||'')}</p><hr><h3>Facture ${esc(r.invoice_no)}</h3><p>Date : ${fd(r.date)}<br>Client : ${esc(r.customer_id?nm('customers',r.customer_id):'Client comptoir')}</p><table style="width:100%;border-collapse:collapse"><tr style="background:#eee"><th align=left style="padding:8px">Article</th><th>Qté</th><th align=right>PU</th><th align=right>Total</th></tr>${its.map(i=>`<tr><td style="padding:8px;border-bottom:1px solid #ddd">${esc(i.name)}</td><td align=center>${i.quantity}</td><td align=right>${money(i.price)}</td><td align=right>${money(i.quantity*i.price)}</td></tr>`).join('')}</table><h3 style="text-align:right">Total : ${money(r.total)}</h3><p style="text-align:right">Payé : ${money(r.paid)} (${esc(r.method)})</p></body></html>`);w.document.close();w.focus();w.print()}}

/* ---------- dashboard ---------- */
const COL=['#14a35f','#2f5bea','#f59e0b','#8b5cf6','#94a3b8'];
function dashboard(){
  const P=D.products,SA=D.sales,cogs=sum(SA.flatMap(s=>s.sale_items||[]),i=>i.cost*i.quantity),rev=sum(SA,s=>s.total),exp=sum(D.expenses,e=>e.amount),cost=cogs+exp;
  const low=P.filter(p=>p.qty>0&&p.qty<=p.min_stock).length,out=P.filter(p=>p.qty<=0).length;
  const yr=new Date().getFullYear(),mo=Array(12).fill(0);SA.forEach(s=>{const d=new Date(s.date);if(d.getFullYear()===yr)mo[d.getMonth()]+=Number(s.total)});
  const mx=Math.max(...mo,1),pts=mo.map((v,i)=>[40+i*(540/11),170-(v/mx)*150]),ln=pts.map(p=>p.join(',')).join(' ');
  const ml=Array.from({length:12},(_,i)=>new Date(2000,i,1).toLocaleDateString(C.locale,{month:'short'}));
  const cc={};P.forEach(p=>{const n=p.category_id?nm('categories',p.category_id):'Sans catégorie';cc[n]=(cc[n]||0)+1});
  let ct=Object.entries(cc).sort((a,b)=>b[1]-a[1]);if(ct.length>5){const r=sum(ct.slice(4),x=>x[1]);ct=ct.slice(0,4).concat([['Autres',r]])}
  let acc=0;const grad=ct.length?ct.map((c,i)=>{const a=acc/P.length*100;acc+=c[1];return `${COL[i]} ${a}% ${acc/P.length*100}%`}).join(','):'var(--mu) 0 100%';
  const ev=[...SA.slice(0,5).map(s=>({d:s.created_at,i:'cart',c:'ok',t:'Facture '+s.invoice_no,s:money(s.total)})),...D.purchases.slice(0,5).map(s=>({d:s.created_at,i:'bag',c:'inf',t:'Achat '+s.ref,s:money(s.total)}))].sort((a,b)=>new Date(b.d)-new Date(a.d)).slice(0,4);
  P.filter(p=>p.qty<=p.min_stock).slice(0,2).forEach(p=>ev.push({i:'warn',c:'bd',t:'Alerte stock : '+p.name,s:p.qty+' restant(s)'}));
  $('#view').innerHTML=`<div class="ban"><div><h2>Bienvenue, ${esc(window.ME||'')} 👋</h2><p>${low+out?`Vous avez ${low+out} article(s) à réapprovisionner.`:'Votre stock est en bonne santé.'}</p></div><div class="mi"><div><b>${P.length}</b><span>Produits</span></div><div><b>${P.length-low-out}</b><span>En stock</span></div><div><b>${low}</b><span>Stock faible</span></div><div><b>${out}</b><span>Rupture</span></div></div></div>
  ${statHtml([['Total ventes',money(rev),'ok','dollar'],['Encaissé',money(sum(SA,s=>s.paid)),'inf','trend'],['Coûts',money(cost),'bd','wallet'],['Bénéfice',money(rev-cost),'wn','chart']])}
  <div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(250px,1fr))">
  <div class="card"><h3>Aperçu du stock</h3><div class="ov2"><div><b>${sum(P,p=>p.qty)}</b><span>Qté en stock</span></div><div><b>${money(sum(P,p=>p.qty*p.purchase_price))}</b><span>Valeur du stock</span></div></div></div>
  <div class="card"><h3>Contacts</h3><div class="ov2"><div><b>${D.customers.length}</b><span>Clients</span></div><div><b>${D.suppliers.length}</b><span>Fournisseurs</span></div></div></div>
  <div class="card"><h3>État du stock</h3>${pbar("Stock faible",low,P.length,"var(--bd)")}${pbar("Groupes d'articles",D.categories.length,Math.max(D.categories.length,1),"var(--inf)")}${pbar("Nombre d'articles",P.length,Math.max(P.length,1),"var(--ok)")}</div>
  <div class="card"><h3>Achats</h3>${pbar("Nombre d'achats",D.purchases.length,Math.max(D.purchases.length,1),"var(--ac)")}${pbar("Coût des achats",sum(D.purchases,p=>p.total),Math.max(sum(D.purchases,p=>p.total),rev,1),"var(--wn)",money(sum(D.purchases,p=>p.total)))}${pbar("Impayés clients",sum(SA,s=>Math.max(0,s.total-s.paid)),Math.max(rev,1),"var(--bd)",money(sum(SA,s=>Math.max(0,s.total-s.paid))))}</div></div>
  <div class="g2"><div class="card"><h3>Ventes ${yr}<small>${money(sum(mo,x=>x))}</small></h3><svg class="chs" viewBox="0 0 600 200"><defs><linearGradient id="gd" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--ac)" stop-opacity=".25"/><stop offset="1" stop-color="var(--ac)" stop-opacity="0"/></linearGradient></defs>${[0,1,2,3].map(i=>`<line x1="40" x2="580" y1="${20+i*50}" y2="${20+i*50}" stroke="var(--ln)"/>`).join('')}<polygon points="40,170 ${ln} 580,170" fill="url(#gd)"/><polyline points="${ln}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--sf)" stroke="var(--ac)" stroke-width="2"><title>${ml[i]} : ${money(mo[i])}</title></circle><text x="${p[0]}" y="192" font-size="10" fill="var(--i3)" text-anchor="middle">${ml[i]}</text>`).join('')}</svg></div>
  <div class="card"><h3>Top catégories</h3><div class="donut"><div class="dn" style="background:conic-gradient(${grad})"><div><span><b>${P.length}</b>Produits</span></div></div><ul class="lg">${ct.map((c,i)=>`<li><i style="background:${COL[i]}"></i>${esc(c[0])}<em>${Math.round(c[1]/P.length*100)}%</em></li>`).join('')||'<li style="color:var(--i3)">Aucun produit</li>'}</ul></div></div></div>
  <div class="g2"><div class="card" style="padding:0"><h3 style="padding:18px 20px 0">Produits récents<small><a href="#products" style="color:var(--ac);text-decoration:none;font-weight:700">Voir tout</a></small></h3><div class="tw" style="border:0"><table><thead><tr><th>Produit</th><th>SKU</th><th>Stock</th><th>Qté</th><th>Prix de vente</th></tr></thead><tbody>${P.slice(0,5).map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.sku||'—')}</td><td>${stk(p)}</td><td>${p.qty}</td><td class="g num"><b>${money(p.selling_price)}</b></td></tr>`).join('')||'<tr><td colspan="5"><div class="emp">Aucun produit</div></td></tr>'}</tbody></table></div></div>
  <div class="card"><h3>Activité récente</h3><ul class="act">${ev.map(e=>`<li><div class="dt tag ${e.c==='bd'?'bad':e.c}" style="padding:0">${ic(e.i)}</div><div><b>${esc(e.t)}</b><small>${esc(e.s)}</small></div></li>`).join('')||'<li style="color:var(--i3)">Aucune activité pour le moment.</li>'}</ul></div></div>`}

/* ---------- reports ---------- */
function reports(){
  const rows=Array.from({length:12},(_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const key=d.toISOString().slice(0,7),inM=x=>(x.date||'').slice(0,7)===key;
    const sa=D.sales.filter(inM),v=sum(sa,s=>s.total),c=sum(sa.flatMap(s=>s.sale_items||[]),i=>i.cost*i.quantity),a=sum(D.purchases.filter(inM),p=>p.total),e=sum(D.expenses.filter(inM),x=>x.amount);
    return {l:d.toLocaleDateString(C.locale,{month:'long',year:'numeric'}),v,a,e,b:v-c-e}});
  const val=sum(D.products,p=>p.qty*p.purchase_price);
  $('#view').innerHTML=`<div class="head"><div><h2>Rapports</h2><p>Performance mensuelle et exports de données.</p></div><div class="acts">${['products','sales','purchases','expenses','customers','suppliers'].map(k=>`<button class="btn gh sm" data-ex="${k}">CSV ${M[k].t}</button>`).join('')}</div></div>
  ${statHtml([['Valeur du stock (achat)',money(val),'inf','box'],['Valeur de revente',money(sum(D.products,p=>p.qty*p.selling_price)),'ok','dollar'],['Marge potentielle',money(sum(D.products,p=>p.qty*(p.selling_price-p.purchase_price))),'wn','trend']])}
  <div class="tw"><table><thead><tr><th>Mois</th><th>Ventes</th><th>Achats</th><th>Dépenses</th><th>Bénéfice net</th></tr></thead><tbody>${rows.map(r=>`<tr><td style="text-transform:capitalize"><b>${r.l}</b></td><td class="num">${money(r.v)}</td><td class="num">${money(r.a)}</td><td class="num">${money(r.e)}</td><td class="num"><b class="${r.b<0?'':'g'}" style="${r.b<0?'color:var(--bd)':''}">${money(r.b)}</b></td></tr>`).join('')}</tbody></table></div>
  <p style="color:var(--i3);margin-top:10px;font-size:12.5px">Bénéfice net = ventes − coût d'achat des articles vendus − dépenses.</p>`;
  $$('[data-ex]').forEach(b=>b.onclick=()=>csv(b.dataset.ex))}

/* ---------- settings ---------- */
function settings(){
  const g=n=>esc(S[n]||''),inp=(n,l,ph,t)=>`<div class="fd"><label>${l}</label><input id="s_${n}" type="${t||'text'}" value="${g(n)}" placeholder="${ph||''}"></div>`;
  const lg=(id,l)=>`<div class="fd"><label>${l}</label><div style="display:flex;gap:10px;align-items:center"><div class="th lgp" id="pv_${id}" style="width:64px;height:64px;border:2px dashed var(--ln);background:var(--bg);font-size:12px">${S[id]?`<img src="${esc(S[id])}" alt="">`:'Logo'}</div><input id="s_${id}" value="${g(id)}" placeholder="URL du logo ou importer →"><label class="btn gh sm" style="cursor:pointer">Importer<input type="file" accept="image/*" data-up="${id}" hidden></label></div></div>`;
  $('#view').innerHTML=`<div class="head"><div><h2>Réglages</h2><p>Tout est modifiable : identité de la société cliente, votre marque d'éditeur, coordonnées et devise.</p></div></div>
  <form id="sf"><div class="g2" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:start">
  <div class="card"><h3>Société cliente<small>affichée dans le logiciel et sur les factures</small></h3>${inp('store_name','Nom de la société *','Ex : Atlas Distribution')}${inp('tagline','Slogan / sous-titre','Gestion de stock')}${lg('logo','Logo de la société')}<div class="fr"><div class="fd"><label>Couleur principale</label><input id="s_accent" type="color" value="${/^#[0-9a-f]{6}$/i.test(S.accent||'')?S.accent:B.accent}" style="height:42px;padding:3px"></div>${inp('currency','Devise','DH')}</div>${inp('email','Email','contact@…','email')}${inp('phone','Téléphone','+212…')}${inp('address','Adresse','')}</div>
  <div class="card"><h3>Votre entreprise (éditeur)<small>affichée en bas du menu et sur la page de connexion</small></h3>${inp('vendor_name','Nom de votre entreprise','Ex : Adil Software')}${inp('vendor_tag','Texte avant le nom','Logiciel développé par')}${lg('vendor_logo','Votre logo')}${inp('vendor_url','Site web / lien','https://…')}<p style="color:var(--i3);font-size:12.5px">Laissez vide pour masquer ce bloc.</p></div></div>
  <div class="ma" style="justify-content:flex-start"><button class="btn">Enregistrer</button></div></form>`;
  ['logo','vendor_logo'].forEach(id=>$('#s_'+id).oninput=e=>$('#pv_'+id).innerHTML=e.target.value?`<img src="${esc(e.target.value)}" alt="">`:'Logo');
  $$('[data-up]').forEach(i=>i.onchange=async()=>{const f=i.files[0],id=i.dataset.up;if(!f)return;if(f.size>3e6)return toast('Image trop lourde (3 Mo max)',1);
    const p='brand-'+id+'-'+Date.now()+'-'+f.name.replace(/[^\w.-]/g,'_');toast('Import…');
    const {error}=await sb.storage.from(C.supabase.bucket).upload(p,f);if(error)return toast(error.message,1);
    const u=sb.storage.from(C.supabase.bucket).getPublicUrl(p).data.publicUrl;$('#s_'+id).value=u;$('#pv_'+id).innerHTML=`<img src="${esc(u)}" alt="">`;toast('Logo importé — pensez à enregistrer')});
  $('#sf').onsubmit=async e=>{e.preventDefault();const v={id:1};
    ['store_name','tagline','logo','accent','currency','email','phone','address','vendor_name','vendor_tag','vendor_logo','vendor_url'].forEach(n=>v[n]=$('#s_'+n).value.trim()||null);
    if(!v.store_name)return toast('Le nom de la société est obligatoire',1);
    const {error}=await sb.from('settings').upsert(v);if(error)return toast(error.message,1);
    S={...S,...v};try{localStorage.setItem('bs',JSON.stringify(S))}catch(x){}brand();toast('Réglages enregistrés')}}
</script>
